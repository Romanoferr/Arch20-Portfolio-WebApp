name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ###########################################################################
  # BUILD — frontend estático (GitHub Pages)
  #
  # Usa APENAS GitHub Variables (VITE_* são públicas e vão para o bundle do
  # navegador). NUNCA coloque secrets aqui — eles acabariam no bundle.
  ###########################################################################
  build:
    runs-on: ubuntu-latest
    env:
      # Valores públicos por-cliente (GitHub Variables).
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
      VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
      VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
      VITE_R2_PUBLIC_URL: ${{ vars.VITE_R2_PUBLIC_URL }}
      VITE_IMG_BASE_URL: ${{ vars.VITE_IMG_BASE_URL }}
      VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
      VITE_R2_UPLOAD_ENDPOINT: ${{ vars.VITE_R2_UPLOAD_ENDPOINT }}
      VITE_R2_DELETE_ENDPOINT: ${{ vars.VITE_R2_DELETE_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      - name: Generate dynamic sitemap (includes project pages)
        run: node scripts/generate-sitemap.mjs
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Prerender static routes for Google indexing
        run: node scripts/prerender-static.mjs
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Copy index.html as 404.html for SPA routing
        run: cp ./dist/index.html ./dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}

  ###########################################################################
  # DEPLOY WORKERS
  #
  # Arquitetura:
  #   - Vars  (não-segredos, por-cliente) → `wrangler deploy --var KEY:VALUE`
  #   - Secrets (credenciais R2/Supabase) → `--secrets-file <arquivo>` montado
  #     no job a partir de GitHub Secrets (nunca impressos).
  #   - Custom Domain → `--domain` vindo de GitHub Variable (nada fixo no repo).
  #
  # O passo "Write secrets file" grava um .env temporário (via
  # scripts/write-worker-secrets.mjs) SEM ecoar valores; o arquivo é consumido
  # e nunca versionado.
  ###########################################################################

  deploy-worker:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        working-directory: worker
        run: npm ci

      - name: Write secrets file (R2 capa)
        working-directory: worker
        env:
          WRANGLER_SECRETS: "SUPABASE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node ../../scripts/write-worker-secrets.mjs worker-secrets.env

      - name: Deploy Cloudflare Worker (R2 capa)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy \
            --var ALLOWED_ORIGINS:"${{ vars.SITE_URL_FRONTEND || vars.VITE_SITE_URL }},http://localhost:5173" \
            --secrets-file worker-secrets.env

  deploy-image-delivery-worker:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        working-directory: worker-image-delivery
        run: npm ci

      - name: Deploy Cloudflare Worker (Image Delivery)
        working-directory: worker-image-delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy \
            --var ORIGIN_BASE_URL:"${{ vars.IMAGES_ORIGIN_URL || vars.VITE_R2_PUBLIC_URL }}" \
            --domain "${{ vars.IMG_DELIVERY_DOMAIN }}"

  deploy-analytics-worker:
    runs-on: ubuntu-latest
    needs: build
    # Só roda se o analytics estiver habilitado (service role configurado).
    if: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler + deps
        working-directory: worker-analytics
        run: npm ci

      - name: Write secrets file (Analytics)
        working-directory: worker-analytics
        env:
          WRANGLER_SECRETS: "SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node ../../scripts/write-worker-secrets.mjs analytics-secrets.env

      - name: Deploy Cloudflare Worker (Analytics)
        working-directory: worker-analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy \
            --var ALLOWED_ORIGINS:"${{ vars.SITE_URL_FRONTEND || vars.VITE_SITE_URL }},http://localhost:5173" \
            --var SITE_DOMAIN:"${{ vars.SITE_DOMAIN || vars.SITE_URL_FRONTEND || vars.VITE_SITE_URL }}" \
            --secrets-file analytics-secrets.env

  ###########################################################################
  # DEPLOY — GitHub Pages
  ###########################################################################
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
