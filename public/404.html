<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Página não encontrada | Arquitetura e Design de Interiores</title>
    <meta name="description" content="Portfólio de arquitetura e design de interiores." />
    <meta name="robots" content="noindex, nofollow" />
    <!--
      Fallback SPA. O workflow de deploy sobrescreve este arquivo com o
      index.html compilado (cp ./dist/index.html ./dist/404.html), então o
      404 servido é o app completo (retorna 200, sem redirect).

      IMPORTANTE: não usar <meta http-equiv="refresh"> aqui. Isso causaria
      "Erro de redirecionamento" no Google Search Console.
    -->
    <script>
      // Guarda a URL atual para que o main.tsx restaure a rota correta
      // após o carregamento do app (fallback client-side da SPA).
      sessionStorage.redirect = location.href
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; padding: 2rem; color: #555">
      Página não encontrada. Redirecionando…
    </p>
  </body>
</html>
